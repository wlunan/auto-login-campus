[Auth]
; 校园网账号（河南师范大学学生网 HTU_Student）
Username = 2023000000
; 密码：复制本文件为 config.ini 后填入真实密码
Password = YOUR_PASSWORD_HERE
; 账号后缀：学生 @htu，教职工 @htu.edu.cn，移动 @yd，联通 @lt，电信 @dx
Suffix = @htu

[Network]
; 用于检测外网是否可达的地址（阿里 DNS，不依赖学校；仅作辅助诊断，在线判断以 HTTP 探测为准）
PingHost = 223.5.5.5
; 未认证时访问这个地址会被 BRAS 302 跳转到 Portal（主探测）
CaptiveUrl = http://1.1.1.1
; 备用 HTTP 探测地址（主探测连接失败时使用，判断是否真的能上网）
FallbackUrl = http://www.msftconnecttest.com/connecttest.txt
; Portal 服务器地址（河南师大教育区 Portal）
PortalBase = http://10.101.2.194:6060
; 认证提交接口（深澜/Srun quickauth）
QuickAuthPath = /quickauth.do

[Settings]
; 每次认证失败后重试间隔（秒）
RetryInterval = 5
; 单次执行最多重试次数
MaxRetries = 3
; 日志文件路径（相对于 scripts 目录）
LogFile = ..\logs\auto_login.log
; 连续在线时，多少分钟写一次心跳日志（避免日志爆炸）
HeartbeatMinutes = 30
